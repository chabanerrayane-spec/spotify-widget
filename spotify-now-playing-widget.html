<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Now Playing — Spotify</title>
<style>
  :root{
    --ink:#eef1ea;
    --dim:#9aa39a;
    --accent:#c7f464;
    --bg-card: rgba(10,14,10,0.68);
    --ring: rgba(199,244,100,0.35);
  }
  html,body{
    margin:0; padding:0;
    background:transparent;
    width:100%; height:100%;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow:hidden;
  }
  #root{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Setup / auth screen ---------- */
  .setup{
    max-width:520px;
    background: rgba(18,20,16,0.92);
    color:var(--ink);
    border-radius:14px;
    padding:28px 30px;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.08);
  }
  .setup h1{
    font-size:19px; margin:0 0 6px; font-weight:600; letter-spacing:0.2px;
  }
  .setup p{
    font-size:13.5px; line-height:1.55; color:var(--dim); margin:0 0 14px;
  }
  .uri-box{
    display:flex; gap:8px; align-items:center;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
  }
  .uri-box code{
    flex:1; font-size:12.5px; color:var(--accent);
    word-break:break-all; font-family: 'SFMono-Regular', Consolas, monospace;
  }
  .uri-box button{
    background:rgba(255,255,255,0.1); border:none; color:var(--ink);
    font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer;
    flex-shrink:0;
  }
  .uri-box button:hover{ background:rgba(255,255,255,0.18); }
  .connect-btn{
    width:100%;
    background:var(--accent);
    color:#111; border:none; border-radius:9px;
    padding:12px 16px; font-size:14px; font-weight:600;
    cursor:pointer; letter-spacing:0.2px;
  }
  .connect-btn:hover{ filter:brightness(1.08); }
  .error{
    color:#ff8a80; font-size:12.5px; margin-top:12px; line-height:1.5;
  }

  /* ---------- Now playing card ---------- */
  .card{
    display:flex; align-items:center; gap:16px;
    background:var(--bg-card);
    border-radius:16px;
    padding:14px 22px 14px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    max-width:460px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .art-wrap{
    width:64px; height:64px; flex-shrink:0; position:relative;
  }
  .art{
    width:64px; height:64px; border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,0.12);
    animation: spin 8s linear infinite;
    animation-play-state: paused;
  }
  .art.spinning{ animation-play-state: running; }
  .hole{
    position:absolute; top:50%; left:50%;
    width:8px; height:8px; border-radius:50%;
    background:#111; border:2px solid rgba(255,255,255,0.5);
    transform:translate(-50%,-50%);
  }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .meta{ min-width:0; flex:1; }
  .title{
    color:var(--ink); font-size:15.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:2px;
  }
  .artist{
    color:var(--dim); font-size:12.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:8px;
  }
  .bar-track{
    height:3px; background:rgba(255,255,255,0.15); border-radius:2px; overflow:hidden;
  }
  .bar-fill{
    height:100%; background:var(--accent); border-radius:2px;
    transition: width 1s linear;
  }
  .times{
    display:flex; justify-content:space-between;
    font-size:10px; color:var(--dim); margin-top:4px;
  }
  .paused-tag{
    font-size:10.5px; color:var(--accent); margin-top:2px; letter-spacing:0.3px;
  }

  .idle-card{
    background:var(--bg-card); color:var(--dim);
    border-radius:14px; padding:14px 20px; font-size:13px;
    border:1px solid rgba(255,255,255,0.06);
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  const CLIENT_ID = "772e216eccdb49cda189b2dd764d447f";
  const SCOPES = "user-read-currently-playing user-read-playback-state";
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const root = document.getElementById('root');

  // ---------- PKCE helpers ----------
  function randomString(len){
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let out = "";
    const arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    for(let i=0;i<len;i++) out += chars[arr[i] % chars.length];
    return out;
  }
  async function sha256base64url(str){
    const enc = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest('SHA-256', enc);
    let bytes = new Uint8Array(digest);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  async function get(key){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function set(key, value){
    try{ await window.storage.set(key, value, false); }catch(e){}
  }
  async function del(key){
    try{ await window.storage.delete(key, false); }catch(e){}
  }

  // ---------- UI renderers ----------
  function renderSetup(errorMsg){
    root.innerHTML = `
      <div class="setup">
        <h1>Connecter Spotify</h1>
        <p>Dans ton application sur developer.spotify.com, ajoute exactement cette adresse comme "Redirect URI", puis clique sur Connecter.</p>
        <div class="uri-box">
          <code id="uri">${REDIRECT_URI}</code>
          <button id="copyBtn">Copier</button>
        </div>
        <button class="connect-btn" id="connectBtn">Connecter mon compte Spotify</button>
        ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      </div>
    `;
    document.getElementById('copyBtn').onclick = () => {
      navigator.clipboard.writeText(REDIRECT_URI);
      const b = document.getElementById('copyBtn');
      b.textContent = 'Copié !';
      setTimeout(()=> b.textContent = 'Copier', 1500);
    };
    document.getElementById('connectBtn').onclick = startAuth;
  }

  function renderIdle(text){
    root.innerHTML = `<div class="idle-card">${text}</div>`;
  }

  function renderTrack(track, isPlaying, progressMs, durationMs){
    const fmt = ms => {
      const s = Math.floor(ms/1000);
      return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
    };
    const pct = durationMs ? Math.min(100, (progressMs/durationMs)*100) : 0;
    root.innerHTML = `
      <div class="card">
        <div class="art-wrap">
          <img class="art ${isPlaying ? 'spinning':''}" src="${track.art}" />
          <div class="hole"></div>
        </div>
        <div class="meta">
          <div class="title">${track.name}</div>
          <div class="artist">${track.artists}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="times">
            <span>${fmt(progressMs)}</span>
            <span>${fmt(durationMs)}</span>
          </div>
          ${isPlaying ? '' : '<div class="paused-tag">En pause</div>'}
        </div>
      </div>
    `;
  }

  // ---------- Auth flow ----------
  async function startAuth(){
    const verifier = randomString(64);
    await set('pkce_verifier', verifier);
    const challenge = await sha256base64url(verifier);
    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: 'code',
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      code_challenge_method: 'S256',
      code_challenge: challenge
    });
    window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
  }

  async function exchangeCode(code){
    const verifier = await get('pkce_verifier');
    const body = new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body
    });
    if(!res.ok) throw new Error('token_exchange_failed');
    const data = await res.json();
    await saveTokens(data);
    // clean the URL so the code isn't reused / left visible
    window.history.replaceState({}, document.title, REDIRECT_URI);
  }

  async function saveTokens(data){
    await set('access_token', data.access_token);
    if(data.refresh_token) await set('refresh_token', data.refresh_token);
    await set('expires_at', String(Date.now() + (data.expires_in*1000) - 15000));
  }

  async function refreshToken(){
    const refresh = await get('refresh_token');
    if(!refresh) return false;
    const body = new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: refresh
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body
    });
    if(!res.ok) return false;
    const data = await res.json();
    await saveTokens(data);
    return true;
  }

  async function getValidToken(){
    let token = await get('access_token');
    const expiresAt = Number(await get('expires_at') || 0);
    if(!token) return null;
    if(Date.now() >= expiresAt){
      const ok = await refreshToken();
      if(!ok) return null;
      token = await get('access_token');
    }
    return token;
  }

  // ---------- Polling ----------
  async function poll(){
    const token = await getValidToken();
    if(!token){
      renderSetup();
      return;
    }
    try{
      const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if(res.status === 204){
        renderIdle('Rien n\'est en cours de lecture sur Spotify.');
        return;
      }
      if(res.status === 401){
        const ok = await refreshToken();
        if(!ok) renderSetup('Session expirée, reconnecte-toi.');
        return;
      }
      if(!res.ok){
        renderIdle('Connexion à Spotify indisponible…');
        return;
      }
      const data = await res.json();
      if(!data || !data.item){
        renderIdle('Rien n\'est en cours de lecture sur Spotify.');
        return;
      }
      const track = {
        name: data.item.name,
        artists: data.item.artists.map(a => a.name).join(', '),
        art: (data.item.album.images[1] || data.item.album.images[0] || {}).url
      };
      renderTrack(track, data.is_playing, data.progress_ms || 0, data.item.duration_ms || 0);
    }catch(e){
      renderIdle('Connexion à Spotify indisponible…');
    }
  }

  // ---------- Boot ----------
  async function boot(){
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const authError = urlParams.get('error');

    if(authError){
      renderSetup('Autorisation refusée sur Spotify. Réessaie.');
      return;
    }
    if(code){
      renderIdle('Connexion en cours…');
      try{
        await exchangeCode(code);
      }catch(e){
        renderSetup('Échec de la connexion. Vérifie que la Redirect URI est bien enregistrée à l\'identique.');
        return;
      }
    }

    const token = await getValidToken();
    if(!token){
      renderSetup();
      return;
    }

    poll();
    setInterval(poll, 4000);
  }

  boot();
})();
</script>
</body>
</html>
